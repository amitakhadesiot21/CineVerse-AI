<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 54" width="260" height="54" fill="none">
  <defs>
    <linearGradient id="cgRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B4E"/>
      <stop offset="50%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#990008"/>
    </linearGradient>
    <linearGradient id="cgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFC94A"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Emblem: Stylized Cinematic 'C' with Aperture -->
  <g transform="translate(4, 3)">
    <!-- Outer Glow Ribbon -->
    <path d="M38,9 C24,9 13,19 13,33 C13,47 24,57 38,57 C45,57 51,54 55,49 L46,41 C44,44 41,46 38,46 C30,46 24,40 24,33 C24,26 30,20 38,20 C41,20 44,22 46,25 L55,17 C51,12 45,9 38,9 Z" fill="url(#cgRed)" filter="url(#neonGlow)"/>
    <!-- Film Aperture Cuts -->
    <rect x="17" y="20" width="3" height="5" rx="1" fill="#141414"/>
    <rect x="15" y="30" width="3" height="5" rx="1" fill="#141414"/>
    <rect x="17" y="40" width="3" height="5" rx="1" fill="#141414"/>
    <!-- Center AI Flare Star -->
    <path d="M38,27 L40,32 L45,33 L40,34 L38,39 L36,34 L31,33 L36,32 Z" fill="url(#cgGold)"/>
    <circle cx="38" cy="33" r="1.8" fill="#FFFFFF"/>
  </g>
  <!-- Typography -->
  <text x="68" y="35" font-family="'Bebas Neue', 'Inter', sans-serif" font-size="30" font-weight="900" letter-spacing="2" fill="#FFFFFF">CINE<tspan fill="#E50914">VERSE</tspan></text>
  <!-- AI Pill Badge -->
  <rect x="206" y="16" width="38" height="20" rx="5" fill="rgba(229,9,20,0.18)" stroke="#E50914" stroke-width="1.2"/>
  <text x="225" y="30.5" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFC94A" text-anchor="middle" letter-spacing="1">AI</text>
</svg>
